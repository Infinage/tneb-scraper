<html lang='en'>
  <head>
    <style>
        table {
        border-collapse: collapse;
        width: 100%;
        }

        th, td {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
        }

        th {
        background-color: #f2f2f2;
        }

        tr:nth-child(even) {
        background-color: #f9f9f9;
        }
    </style>
  </head>
  <body>
    <table>
      <thead>
      <tr>
          <th>S No.</th>
          <th>Consumer Number</th>
          <th>Consumer Name</th>
          <th>Bill Amount</th>
          <th>Due Date</th>
      </tr>
      </thead>
      <tbody>
        {{if .}}
          {{range $idx, $row := .}}
            <tr>
                <td>{{inc $idx}}</td>
                <td>{{$row.ConsumerNo}}</td>
                <td>{{$row.ConsumerName}}</td>
                <td>Rs.{{$row.BillAmt}}</td>
                <td>{{$row.Due.Format "02 Jan 2006"}}</td>
            </tr>
          {{end}}
        {{else}}
          <tr>
            <td colspan='5'>
              No scraped results were found. All bills have been paid.
            </td>
          </tr>
        {{end}}
      </tbody>
    </table>
  </body>
</html>
